<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link type="image/x-icon" rel="icon" href="/FrontEnd/qrcode-solid-full.svg">
    <title>QR Code Generator</title>
    <style>
        body{
            background-color: rgb(18, 21, 34);
            font-family: 'Montserrat';
        }
        input,button,textarea{
            font-family:inherit;
            font-size:inherit;
        }
        .generator{
            background-color: rgb(32, 36, 49);
            border: 1px solid rgb(32, 36, 49);
            border-radius: 10px;
            width: 25%;
            margin-left: auto;
            margin-right: auto;
            margin-top: 7rem;
            padding-bottom:1rem;
        }
        #heading{
            text-align: center;
            color: white;
        }
        #input{
            width: 85%;
            height: 4vh;
            margin-left: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            padding-left: 0.6rem;
            background-color: rgb(23,26,36);
            color: white;
        }
        #button{
            width: 90%;
            height: 5vh;
            margin-left: 1rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            background-color: rgb(30,84, 207);
            color: white;
        }
        #button{
            text-align:center;
        }
        button a{
            color:white;
            text-decoration:none;
        }
        .image{
            display:flex;
            justify-content: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <form>
        <div class="generator">
            <h1 id="heading">QR Code Generator</h1>
            <input type="text" name="url-input" id="input" placeholder="Enter text or URL"><br>
            <button id="button">Generate QR</button><br>
            <div class="image">
                <img src="qr_img.png" id="image" alt="image of the url">
            </div>
            <button id="button">
                <a href="#">Download QR</a>
            </button>
        </div>
    </form>
</body>
</html>
